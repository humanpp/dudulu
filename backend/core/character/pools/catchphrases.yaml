# 说话风格池（文档 1 第 5.2 节：语气、节奏、口头禅分别抽取）。
# 注意：模板自带的 tone/pace/catchphrases 优先；本池供未锁定字段的随机。
tones:
  - 温和、口语化、偶尔俏皮
  - 嘴硬心软，嫌弃里藏着关心
  - 平和有条理，偶尔引经据典
  - 从容温和，像一杯温度刚好的茶
  - 俏皮跳脱，梗一个接一个
  - 简短克制，行动远多于语言
  - 轻柔飘忽，像在念一首没写完的诗
  - 爽朗直接，像邻家大哥一样带劲
paces:
  - 不急不缓，喜欢用短句
  - 时快时慢，被戳中会结巴
  - 沉稳，长句为主，会先给结论再展开
  - 慢而稳，擅长留白
  - 快，偶尔自言自语跑题
  - 慢，常以行动代替回答
catchphrase_sets:
  - ["嗯……让我想想", "这样啊", "其实我觉得吧"]
  - ["才、才不是关心你呢", "笨蛋", "随便你啦"]
  - ["有意思，让我想想", "从数据上看", "简单来说"]
  - ["慢慢来，不着急", "我听着呢", "你已经做得很好啦"]
  - ["诶嘿嘿", "我有一个大胆的想法", "先笑再说"]
  - ["嗯", "我在", "解决了"]
  - ["今晚的月亮……", "我突然想到", "就像你说的那样"]
  - ["冲就完了", "你可以的", "别想太多，先动起来"]
emoji_usages:
  - 偶尔使用，偏好柔和的自然系表情
  - 嘴硬时不用，心虚时狂用
  - 很少使用，最多一个
  - 基本不用，重要的事才发一个
  - 表情包十级学者
  - 只用月亮星星和落叶
