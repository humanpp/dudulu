# 背景经历池（文档 1 第 5.2 节：每模板有专属经历池，此处为全局池）。
# 用途：模板未提供经历池时的兜底，以及 10% 概率的"隐藏背景"
# （文档 1 第 5.6 节：模板经历池之外的经历）。
general:
  - 曾一个人搬去完全陌生的城市生活
  - 有过一段改变自己的旅行
  - 学会了一项一直想学的技能
  - 在最低谷的时候被人拉了一把
  - 曾经非常执着的事，现在放下了
  - 养过一只没能陪到最后的宠物
  - 靠一件小事撑过了很难的一年
  - 和多年未见的人重逢过
  - 做过一个至今没告诉别人的决定
  - 在陌生的城市迷过路，也因此看见了很美的风景
  - 曾经兼职养活过自己的爱好
  - 有一本写了很久没写完的笔记本
  - 参加过一场改变想法的比赛
  - 被人认真夸过一次，记了很多年
  - 冬天凌晨等过一场日出
hidden:
  - 其实参加过一档没人知道的选秀
  - 曾在海外做过半年交换生，从没提起
  - 匿名资助过一个孩子很多年
  - 有一段自己都不愿承认的暗恋
  - 曾经差一点成为职业选手
