# dudulu_config.yaml
version: "0.8"
project: "dudulu"

expression_layer:
  dimensions: [PLE, ARO, DOM, INT, SEC]
  ranges:
    PLE: [-1.0, 1.0]
    ARO: [-1.0, 1.0]
    DOM: [-1.0, 1.0]
    INT: [0.0, 1.0]
    SEC: [0.0, 1.0]
  initial: {PLE: 0.15, ARO: 0.00, DOM: 0.00, INT: 0.20, SEC: 0.30}
  soft_clamp_margin: 0.15

internal_layer:
  dimensions: [ANX, LON, CUR, ANT, GUI, PRO, DEP, PAT, VUL, SAT, JEA, TRU]
  range: [0.0, 1.0]
  # 注意：文档 1 第十四章此处原文为块样式逗号分隔对（ANX: 0.10, LON: 0.30, ...），
  # 那不是合法 YAML，无法被 safe_load 解析；此处按文档自身其余单行 dict 的 flow
  # 风格改写，键值与原文档完全一致。
  initial: {ANX: 0.10, LON: 0.30, CUR: 0.50, ANT: 0.20,
            GUI: 0.00, PRO: 0.10, DEP: 0.15, PAT: 0.70,
            VUL: 0.10, SAT: 0.50, JEA: 0.00, TRU: 0.25}

affective_layer:
  dimensions: [AFF, TRS, ATT]     # 可衰减的三维；STG 不在此列，由下方 stages 判定
  ranges: {AFF: [0, 100], TRS: [0, 100], ATT: [0, 100]}
  initial: {AFF: 15, TRS: 25, ATT: 10}
  stages:
    S0: {AFF: [0, 20], label: "陌生"}
    S1: {AFF: [20, 40], label: "认识"}
    S2: {AFF: [40, 60], label: "熟悉"}
    S3: {AFF: [60, 80], TRS_min: 50, label: "亲密"}
    S4: {AFF: [80, 100], TRS_min: 70, ATT_min: 60, label: "深度绑定"}

decay:
  expression_half_life_hours: 4.0
  mood_half_life_days: 5.0
  affective_half_life_days: {AFF: 30, TRS: 90, ATT: 180}
  valence_modulation: true

event_labels:
  - {name: affectionate, base_intensity: 0.6}
  - {name: playful, base_intensity: 0.4}
  - {name: vulnerable, base_intensity: 0.7}
  - {name: reassuring, base_intensity: 0.5}
  - {name: curious, base_intensity: 0.3}
  - {name: neutral, base_intensity: 0.1}
  - {name: conflict, base_intensity: 0.7}
  - {name: hostile, base_intensity: 0.9}
  - {name: withdrawn, base_intensity: 0.4}

sedimentation:
  session_summary: true
  daily_snapshot: true
  weekly_trend: true
  peak_weight: 0.5
  ending_weight: 0.3
  average_weight: 0.2

# ── 主动行为配置（v0.4 新增）──
proactive:
  enabled: true                      # 功能级开关：关掉只停用主动行为，沉淀任务不受影响；进程级开关是 Settings.SCHEDULER_ENABLED，见文档 2 第 8.1 节
  interval_hours: 4.5
  min_gap_hours: 3.0
  max_daily: 3
  silence_threshold: 3
  silence_recovery_hours: 12
  default_eagerness: 1.0             # 全局默认主动意愿系数；角色的 emotion_overrides.proactive.eagerness 覆盖它（见 12.7）
  triggers:
    loneliness: {threshold: 0.7, weight: "high"}
    anticipation: {threshold: 0.6, weight: "high"}
    decay_heap: {weight: "medium"}
    mood_deviation: {threshold: 0.3, weight: "medium"}
    time_interval: {weight: "low"}
  quiet_hours: [23, 8]              # 夜间静默（用户本地时间）

# ── 模板系统配置 ──
templates:
  directory: "dudulu/backend/core/character/templates/"
  builtin: [gentle_artist, energetic_coach, tsundere_childhood, intellectual_scholar,
            gentle_senior, playful_trickster, stoic_guardian, dreamy_poet]
  allow_community: true
  allow_inheritance: true

# ── 随机生成配置 ──
randomization:
  name_pools:
    male: "dudulu/backend/core/character/names/male.txt"
    female: "dudulu/backend/core/character/names/female.txt"
    non_binary: "dudulu/backend/core/character/names/neutral.txt"
  age_range: [18, 35]
  height_distribution: {mean: 165, std: 8}
  body_type_weights: {slim: 0.30, athletic: 0.25, curvy: 0.25, plump: 0.20}
  gender_weights: {male: 0.40, female: 0.40, non_binary: 0.20}
  max_retry: 10
  rare_trait_probability: 0.05
  hidden_background_probability: 0.10
  emotion_egg_probability: 0.03
